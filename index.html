<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TechMart - Smart Price Finder</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>TechMart</h1>
        <p>Smart Price Finder</p>
    </header>

    <main>

        <section class="price-finder">

            <h2>Find Products Around Your Price</h2>

            <div class="search-box">

                <input
                    type="number"
                    id="priceInput"
                    placeholder="Enter target price"
                >

                <button id="searchBtn">
                    Search
                </button>

            </div>



            <div class="range-search">

                <h3>Find Products in Price Range</h3>

                <div class="range-inputs">

                    <input
                        type="number"
                        id="minPrice"
                        placeholder="Minimum Price"
                    >

                    <input
                        type="number"
                        id="maxPrice"
                        placeholder="Maximum Price"
                    >

                    <button id="rangeSearchBtn">
                        Find Products in This Range
                    </button>

                </div>

            </div>

        </section>
        

<section class="popular-section">

    <div class="popular-header">

        <h2>🔥 Popular Products</h2>

        <div class="top-k-box">

            <label for="topK">Show Top:</label>

            <select id="topK">
                <option value="3">3</option>
                <option value="5">5</option>
                <option value="10">10</option>
            </select>

        </div>

    </div>


    <div id="popularProducts" class="product-grid">

        <p class="message">
            Popular products will appear here.
        </p>

    </div>

</section>
       

        <section class="results-section">

            <h2>Closest Products</h2>

            <div id="results" class="product-grid">

                <p class="message">
                    Enter a price and click Search.
                </p>

            </div>

        </section>

        <section class="recent-section">

    <div class="recent-header">

        <h2>🕘 Recently Viewed</h2>

        <button id="clearHistoryBtn">
            Clear History
        </button>

    </div>

    <div id="recentProducts" class="product-grid">

        <p class="message">
            No recently viewed products.
        </p>

    </div>

</section>

    </main>


    <script src="data.js"></script>
    <script src="app.js"></script>

</body>

</html>
